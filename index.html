<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Pengurusan LOT 77 (Firebase Live)</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
            transition: background-color 0.3s;
        }
        th {
            background-color: #34495e;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
            text-align: center;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .center-check {
            text-align: center;
        }
        input[type="checkbox"] {
            transform: scale(1.5);
            cursor: pointer;
            accent-color: #27ae60;
        }
        
        /* Highlight hijau bila tick */
        .ticked-cell {
            background-color: #d5f5e3 !important; 
        }

        /* Input untuk nama kosong */
        .name-input {
            width: 95%;
            padding: 8px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            font-family: inherit;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            align-items: center;
        }
        button {
            padding: 10px 15px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #c0392b;
        }
        .info-text {
            font-size: 13px;
            color: #27ae60;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Senarai Pengurusan Hartanah: LOT 77 (Sistem Cloud)</h2>
    
    <div class="controls">
        <span class="info-text">☁️ Firebase Connected: Data dikemaskini secara LIVE di semua peranti.</span>
        <button onclick="clearData()">Reset Semua Data Cloud</button>
    </div>

    <div class="table-responsive">
        <table id="landTable">
            <thead>
                <tr>
                    <th width="5%">PLOT</th>
                    <th width="35%" style="text-align: left;">NAMA</th>
                    <th width="15%" class="center-check">Tarik Kaveat</th>
                    <th width="20%" class="center-check">Bayaran SPA<br><small style="font-weight: normal;">(RM272.40 / RM372.40)</small></th>
                    <th width="25%" class="center-check">Bayaran Pindah Milik<br><small style="font-weight: normal;">(Mengikut invoice dihantar pada pemilik tanah)</small></th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="5" style="text-align: center; padding: 30px; color: #7f8c8d;">Memuatkan data dari awan (cloud)...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // ==========================================
    // TETAPAN FIREBASE MILIK ANDA LENGKAP
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyBbAqOkHZf3caM6YybHXWKWbOF3MMG6_9c",
        authDomain: "lot77-tracker.firebaseapp.com",
        projectId: "lot77-tracker",
        storageBucket: "lot77-tracker.firebasestorage.app",
        messagingSenderId: "885759825036",
        appId: "1:885759825036:web:a642b7f2b312fc47e597a9",
        measurementId: "G-NB4B5XVFVZ",
        databaseURL: "https://lot77-tracker-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    // ==========================================

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Senarai data asal berasaskan imej
    const defaultDataList = [
        { plot: "A", name: "Mohd Izham Bin Mohd Hamzah", defaultSpa: true },
        { plot: "B", name: "Mohd Hanafi Bin Mohd Yasin", defaultSpa: true },
        { plot: "C", name: "Juliana Binti Jaafar", defaultSpa: false },
        { plot: "D", name: "Norliza Binti Hussin", defaultSpa: false },
        { plot: "E", name: "Abdul Rahim Bin Yaacob", defaultSpa: false },
        { plot: "F", name: "Anitha Binti Mohd Salleh", defaultSpa: false },
        { plot: "G", name: "Azri Bin Ghazali", defaultSpa: true },
        { plot: "H", name: "Mohd Sharif Bin Paan", defaultSpa: false },
        { plot: "I", name: "Ahmad Ridzuan Bin Zainal Abidin", defaultSpa: false },
        { plot: "J", name: "Fauzan Bin Jaafar", defaultSpa: true },
        { plot: "K", name: "Hazlina Binti Mustapha", defaultSpa: false },
        { plot: "L", name: "Pesak Amri Bin Sani", defaultSpa: false },
        { plot: "M", name: "Nur Dini Humaira Binti Mohamad Yusoff", defaultSpa: false },
        { plot: "N", name: "Azman Bin Abu Bakar", defaultSpa: false },
        { plot: "O", name: "Azam Syamir Bin Norizam", defaultSpa: false },
        { plot: "10", name: "Siti Nurhidayah Binti Abdul Razak", defaultSpa: false },
        { plot: "11", name: "Rokiah Binti Daiman", defaultSpa: false },
        { plot: "12", name: "Anuar Bin Ahmad", defaultSpa: false },
        { plot: "13", name: "Anuar Bin Ahmad", defaultSpa: false },
        { plot: "14", name: "Mohd Anuar Bin Mat Isa", defaultSpa: false },
        { plot: "15", name: "Mohd Anuar Bin Mat Isa", defaultSpa: false },
        { plot: "16", name: "Meor Ibrahim Bin Meor Harun", defaultSpa: false },
        { plot: "17", name: "Kamarudin Bin Ismail", defaultSpa: true },
        { plot: "18", name: "Datin Saniah Musa", defaultSpa: true },
        { plot: "19", name: "Mohd Faizal Bin Abdullah @ Husain (Cikgu)", defaultSpa: false },
        { plot: "20", name: "En. Rahman", defaultSpa: false },
        { plot: "21", name: "Halimatus Sa'adiah Binti Talib (Cikgu)", defaultSpa: false },
        { plot: "23", name: "Hajah Siti Norashikin", defaultSpa: false },
        { plot: "24", name: "", defaultSpa: false },
        { plot: "25", name: "", defaultSpa: false },
        { plot: "26", name: "", defaultSpa: false },
        { plot: "27", name: "", defaultSpa: false },
        { plot: "28", name: "", defaultSpa: false },
        { plot: "29", name: "", defaultSpa: false },
        { plot: "30", name: "", defaultSpa: false },
        { plot: "31", name: "", defaultSpa: false },
        { plot: "32", name: "", defaultSpa: false },
        { plot: "33", name: "", defaultSpa: false },
        { plot: "34", name: "En. Masiron", defaultSpa: true },
        { plot: "35", name: "", defaultSpa: false }
    ];

    const tbody = document.querySelector("#landTable tbody");

    // Mendengar sebarang perubahan data dari Firebase cloud secara Realtime
    database.ref('lot77').on('value', (snapshot) => {
        const cloudData = snapshot.val() || {};
        renderTable(cloudData);
    });

    function renderTable(cloudData) {
        tbody.innerHTML = "";
        
        defaultDataList.forEach((item) => {
            const tr = document.createElement("tr");
            const plotKey = item.plot;

            // Dapatkan data daripada cloud, sekiranya tiada guna data asal (default)
            const isKaveatTicked = (cloudData[plotKey] && cloudData[plotKey].kaveat) || false;
            
            let isSpaTicked = item.defaultSpa;
            if (cloudData[plotKey] && cloudData[plotKey].hasOwnProperty('spa')) {
                isSpaTicked = cloudData[plotKey].spa;
            }
            
            const isPindahMilikTicked = (cloudData[plotKey] && cloudData[plotKey].pindahmilik) || false;

            // Kelas CSS warna latar (hijau jika di-tick)
            const kaveatClass = isKaveatTicked ? 'center-check ticked-cell' : 'center-check';
            const spaClass = isSpaTicked ? 'center-check ticked-cell' : 'center-check';
            const pindahMilikClass = isPindahMilikTicked ? 'center-check ticked-cell' : 'center-check';

            // Semak paparan nama custom atau asal
            const cloudName = (cloudData[plotKey] && cloudData[plotKey].name !== undefined) ? cloudData[plotKey].name : item.name;
            
            let nameContent = "";
            if (item.name === "") {
                nameContent = `<input type="text" class="name-input" data-plot="${plotKey}" value="${cloudName}" placeholder="Taip nama pemilik baru...">`;
            } else {
                nameContent = cloudName;
            }

            tr.innerHTML = `
                <td style="text-align: center; font-weight: bold;">${item.plot}</td>
                <td>${nameContent}</td>
                <td class="${kaveatClass}">
                    <input type="checkbox" data-plot="${plotKey}" data-type="kaveat" ${isKaveatTicked ? 'checked' : ''}>
                </td>
                <td class="${spaClass}">
                    <input type="checkbox" data-plot="${plotKey}" data-type="spa" ${isSpaTicked ? 'checked' : ''}>
                </td>
                <td class="${pindahMilikClass}">
                    <input type="checkbox" data-plot="${plotKey}" data-type="pindahmilik" ${isPindahMilikTicked ? 'checked' : ''}>
                </td>
            `;
            tbody.appendChild(tr);
        });

        // Event Listener untuk penukaran Checkbox (Hantar ke Firebase)
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const plot = this.getAttribute('data-plot');
                const type = this.getAttribute('data-type');
                const isChecked = this.checked;

                // Simpan terus ke database
                database.ref('lot77/' + plot + '/' + type).set(isChecked);
            });
        });

        // Event Listener untuk Input Nama (Hantar ke Firebase)
        document.querySelectorAll('.name-input').forEach(input => {
            input.addEventListener('change', function() { 
                const plot = this.getAttribute('data-plot');
                const newName = this.value;

                database.ref('lot77/' + plot + '/name').set(newName);
            });
        });
    }

    // Fungsi Padam Data Keseluruhan di Cloud
    function clearData() {
        if(confirm("Adakah anda pasti untuk memadam/reset semua rekod di pangkalan data awan (cloud)?")) {
            database.ref('lot77').remove();
        }
    }
</script>

</body>
</html>
