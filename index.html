<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Pengurusan LOT 77</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
            transition: background-color 0.3s;
        }
        th {
            background-color: #34495e;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
            text-align: center;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .center-check {
            text-align: center;
        }
        input[type="checkbox"] {
            transform: scale(1.5);
            cursor: pointer;
            accent-color: #27ae60;
        }
        
        /* Highlight hijau bila tick */
        .ticked-cell {
            background-color: #d5f5e3 !important; /* Warna hijau lembut */
        }

        /* Input untuk nama kosong */
        .name-input {
            width: 95%;
            padding: 8px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            font-family: inherit;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        button {
            padding: 10px 15px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #c0392b;
        }
        .info-text {
            font-size: 12px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Senarai Pengurusan Hartanah: LOT 77</h2>
    
    <div class="controls">
        <span class="info-text">💡 Perubahan nama & tick akan disimpan secara automatik. Kotak akan jadi hijau jika siap.</span>
        <button onclick="clearData()">Reset Semua Data</button>
    </div>

    <div class="table-responsive">
        <table id="landTable">
            <thead>
                <tr>
                    <th width="5%">PLOT</th>
                    <th width="35%" style="text-align: left;">NAMA</th>
                    <th width="15%" class="center-check">Tarik Kaveat</th>
                    <th width="20%" class="center-check">Bayaran SPA<br><small style="font-weight: normal;">(RM272.40 / RM372.40)</small></th>
                    <th width="25%" class="center-check">Bayaran Pindah Milik<br><small style="font-weight: normal;">(Mengikut invoice dihantar pada pemilik tanah)</small></th>
                </tr>
            </thead>
            <tbody>
                <!-- Baris akan dijana oleh JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Data asas
    const dataList = [
        { plot: "A", name: "Mohd Izham Bin Mohd Hamzah", defaultSpa: true },
        { plot: "B", name: "Mohd Hanafi Bin Mohd Yasin", defaultSpa: true },
        { plot: "C", name: "Juliana Binti Jaafar", defaultSpa: false },
        { plot: "D", name: "Norliza Binti Hussin", defaultSpa: false },
        { plot: "E", name: "Abdul Rahim Bin Yaacob", defaultSpa: false },
        { plot: "F", name: "Anitha Binti Mohd Salleh", defaultSpa: false },
        { plot: "G", name: "Azri Bin Ghazali", defaultSpa: true },
        { plot: "H", name: "Mohd Sharif Bin Paan", defaultSpa: false },
        { plot: "I", name: "Ahmad Ridzuan Bin Zainal Abidin", defaultSpa: false },
        { plot: "J", name: "Fauzan Bin Jaafar", defaultSpa: true },
        { plot: "K", name: "Hazlina Binti Mustapha", defaultSpa: false },
        { plot: "L", name: "Pesak Amri Bin Sani", defaultSpa: false },
        { plot: "M", name: "Nur Dini Humaira Binti Mohamad Yusoff", defaultSpa: false },
        { plot: "N", name: "Azman Bin Abu Bakar", defaultSpa: false },
        { plot: "O", name: "Azam Syamir Bin Norizam", defaultSpa: false },
        { plot: "10", name: "Siti Nurhidayah Binti Abdul Razak", defaultSpa: false },
        { plot: "11", name: "Rokiah Binti Daiman", defaultSpa: false },
        { plot: "12", name: "Anuar Bin Ahmad", defaultSpa: false },
        { plot: "13", name: "Anuar Bin Ahmad", defaultSpa: false },
        { plot: "14", name: "Mohd Anuar Bin Mat Isa", defaultSpa: false },
        { plot: "15", name: "Mohd Anuar Bin Mat Isa", defaultSpa: false },
        { plot: "16", name: "Meor Ibrahim Bin Meor Harun", defaultSpa: false },
        { plot: "17", name: "Kamarudin Bin Ismail", defaultSpa: true },
        { plot: "18", name: "Datin Saniah Musa", defaultSpa: true },
        { plot: "19", name: "Mohd Faizal Bin Abdullah @ Husain (Cikgu)", defaultSpa: false },
        { plot: "20", name: "En. Rahman", defaultSpa: false },
        { plot: "21", name: "Halimatus Sa'adiah Binti Talib (Cikgu)", defaultSpa: false },
        { plot: "23", name: "Hajah Siti Norashikin", defaultSpa: false },
        { plot: "24", name: "", defaultSpa: false },
        { plot: "25", name: "", defaultSpa: false },
        { plot: "26", name: "", defaultSpa: false },
        { plot: "27", name: "", defaultSpa: false },
        { plot: "28", name: "", defaultSpa: false },
        { plot: "29", name: "", defaultSpa: false },
        { plot: "30", name: "", defaultSpa: false },
        { plot: "31", name: "", defaultSpa: false },
        { plot: "32", name: "", defaultSpa: false },
        { plot: "33", name: "", defaultSpa: false },
        { plot: "34", name: "En. Masiron", defaultSpa: true },
        { plot: "35", name: "", defaultSpa: false }
    ];

    const tbody = document.querySelector("#landTable tbody");

    // Load data tersimpan
    const savedData = JSON.parse(localStorage.getItem("lot77Data")) || {};

    function renderTable() {
        tbody.innerHTML = "";
        
        dataList.forEach((item) => {
            const tr = document.createElement("tr");

            // Tick status
            const isKaveatTicked = savedData[`${item.plot}_kaveat`] || false;
            const isSpaTicked = savedData.hasOwnProperty(`${item.plot}_spa`) ? savedData[`${item.plot}_spa`] : item.defaultSpa;
            const isPindahMilikTicked = savedData[`${item.plot}_pindahmilik`] || false;

            // Warna hijau jika di-tick
            const kaveatClass = isKaveatTicked ? 'center-check ticked-cell' : 'center-check';
            const spaClass = isSpaTicked ? 'center-check ticked-cell' : 'center-check';
            const pindahMilikClass = isPindahMilikTicked ? 'center-check ticked-cell' : 'center-check';

            // Nama (Input text untuk yang kosong)
            const savedCustomName = savedData[`${item.plot}_name`];
            const displayName = savedCustomName !== undefined ? savedCustomName : item.name;
            
            let nameContent = "";
            if (item.name === "") {
                nameContent = `<input type="text" class="name-input" data-plot="${item.plot}" value="${displayName}" placeholder="Sila isi nama & automatik disave...">`;
            } else {
                nameContent = displayName;
            }

            tr.innerHTML = `
                <td style="text-align: center; font-weight: bold;">${item.plot}</td>
                <td>${nameContent}</td>
                <td class="${kaveatClass}">
                    <input type="checkbox" data-plot="${item.plot}" data-type="kaveat" ${isKaveatTicked ? 'checked' : ''}>
                </td>
                <td class="${spaClass}">
                    <input type="checkbox" data-plot="${item.plot}" data-type="spa" ${isSpaTicked ? 'checked' : ''}>
                </td>
                <td class="${pindahMilikClass}">
                    <input type="checkbox" data-plot="${item.plot}" data-type="pindahmilik" ${isPindahMilikTicked ? 'checked' : ''}>
                </td>
            `;
            tbody.appendChild(tr);
        });

        // Event Listener untuk Checkbox (Tick & tukar warna)
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const plot = this.getAttribute('data-plot');
                const type = this.getAttribute('data-type');
                const isChecked = this.checked;

                // Update kelas warna latar
                if(isChecked) {
                    this.parentElement.classList.add('ticked-cell');
                } else {
                    this.parentElement.classList.remove('ticked-cell');
                }

                // Save data
                savedData[`${plot}_${type}`] = isChecked;
                localStorage.setItem("lot77Data", JSON.stringify(savedData));
            });
        });

        // Event Listener untuk Nama Input (Save Automatik bila ditaip)
        document.querySelectorAll('.name-input').forEach(input => {
            input.addEventListener('input', function() {
                const plot = this.getAttribute('data-plot');
                const newName = this.value;

                // Save nama 
                savedData[`${plot}_name`] = newName;
                localStorage.setItem("lot77Data", JSON.stringify(savedData));
            });
        });
    }

    // Fungsi Padam Data
    function clearData() {
        if(confirm("Adakah anda pasti untuk memadam semua rekod tapak, nama dan bayaran?")) {
            localStorage.removeItem("lot77Data");
            for (let key in savedData) delete savedData[key];
            renderTable(); 
        }
    }

    // Run kali pertama
    renderTable();
</script>

</body>
</html>
