<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Pengurusan LOT 77</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
            transition: background-color 0.3s ease; /* Smooth color transition */
        }
        th {
            background-color: #34495e;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        
        /* Highlight Class for Ticked Boxes */
        .bg-green {
            background-color: #d4edda !important;
        }
        
        .center-check {
            text-align: center;
        }
        input[type="checkbox"] {
            transform: scale(1.5);
            cursor: pointer;
            accent-color: #27ae60;
        }
        
        /* Input text style for empty names */
        .name-input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
            font-size: 14px;
        }
        .name-input:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        button {
            padding: 10px 15px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #c0392b;
        }
        .info-text {
            font-size: 13px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Senarai Pengurusan Hartanah: LOT 77</h2>
    
    <div class="controls">
        <span class="info-text">💡 Perubahan disimpan secara automatik. Kotak akan bertukar hijau jika selesai.</span>
        <button onclick="clearData()">Reset Semua Data</button>
    </div>

    <div class="table-responsive">
        <table id="landTable">
            <thead>
                <tr>
                    <th width="5%">PLOT</th>
                    <th width="50%">NAMA</th>
                    <th width="15%" class="center-check">Tarik Kaveat</th>
                    <th width="15%" class="center-check">Bayaran SPA</th>
                    <th width="15%" class="center-check">Bayaran Lawyer</th>
                </tr>
            </thead>
            <tbody>
                <!-- Rows will be generated by JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Data asal dari jadual gambar
    const dataList = [
        { plot: "A", name: "Mohd Izham Bin Mohd Hamzah", defaultSpa: true },
        { plot: "B", name: "Mohd Hanafi Bin Mohd Yasin", defaultSpa: true },
        { plot: "C", name: "Juliana Binti Jaafar", defaultSpa: false },
        { plot: "D", name: "Norliza Binti Hussin", defaultSpa: false },
        { plot: "E", name: "Abdul Rahim Bin Yaacob", defaultSpa: false },
        { plot: "F", name: "Anitha Binti Mohd Salleh", defaultSpa: false },
        { plot: "G", name: "Azri Bin Ghazali", defaultSpa: true },
        { plot: "H", name: "Mohd Sharif Bin Paan", defaultSpa: false },
        { plot: "I", name: "Ahmad Ridzuan Bin Zainal Abidin", defaultSpa: false },
        { plot: "J", name: "Fauzan Bin Jaafar", defaultSpa: true },
        { plot: "K", name: "Hazlina Binti Mustapha", defaultSpa: false },
        { plot: "L", name: "Pesak Amri Bin Sani", defaultSpa: false },
        { plot: "M", name: "Nur Dini Humaira Binti Mohamad Yusoff", defaultSpa: false },
        { plot: "N", name: "Azman Bin Abu Bakar", defaultSpa: false },
        { plot: "O", name: "Azam Syamir Bin Norizam", defaultSpa: false },
        { plot: "10", name: "Siti Nurhidayah Binti Abdul Razak", defaultSpa: false },
        { plot: "11", name: "Rokiah Binti Daiman", defaultSpa: false },
        { plot: "12", name: "Anuar Bin Ahmad", defaultSpa: false },
        { plot: "13", name: "Anuar Bin Ahmad", defaultSpa: false },
        { plot: "14", name: "Mohd Anuar Bin Mat Isa", defaultSpa: false },
        { plot: "15", name: "Mohd Anuar Bin Mat Isa", defaultSpa: false },
        { plot: "16", name: "Meor Ibrahim Bin Meor Harun", defaultSpa: false },
        { plot: "17", name: "Kamarudin Bin Ismail", defaultSpa: true },
        { plot: "18", name: "Datin Saniah Musa", defaultSpa: true },
        { plot: "19", name: "Mohd Faizal Bin Abdullah @ Husain (Cikgu)", defaultSpa: false },
        { plot: "20", name: "En. Rahman", defaultSpa: false },
        { plot: "21", name: "Halimatus Sa'adiah Binti Talib (Cikgu)", defaultSpa: false },
        { plot: "23", name: "Hajah Siti Norashikin", defaultSpa: false },
        { plot: "24", name: "", defaultSpa: false },
        { plot: "25", name: "", defaultSpa: false },
        { plot: "26", name: "", defaultSpa: false },
        { plot: "27", name: "", defaultSpa: false },
        { plot: "28", name: "", defaultSpa: false },
        { plot: "29", name: "", defaultSpa: false },
        { plot: "30", name: "", defaultSpa: false },
        { plot: "31", name: "", defaultSpa: false },
        { plot: "32", name: "", defaultSpa: false },
        { plot: "33", name: "", defaultSpa: false },
        { plot: "34", name: "En. Masiron", defaultSpa: true },
        { plot: "35", name: "", defaultSpa: false }
    ];

    const tbody = document.querySelector("#landTable tbody");

    // Load saved data from localStorage
    const savedData = JSON.parse(localStorage.getItem("lot77Data")) || {};

    // Fungsi untuk melukis semula jadual
    function renderTable() {
        tbody.innerHTML = "";
        
        dataList.forEach((item) => {
            const tr = document.createElement("tr");

            // Semak data dalam storage. Jika tiada, guna nilai asal
            const isKaveatTicked = savedData[`${item.plot}_kaveat`] || false;
            const isSpaTicked = savedData.hasOwnProperty(`${item.plot}_spa`) ? savedData[`${item.plot}_spa`] : item.defaultSpa;
            const isLawyerTicked = savedData[`${item.plot}_lawyer`] || false;
            
            // Nama custom jika diisi oleh user
            const customName = savedData[`${item.plot}_name`] !== undefined ? savedData[`${item.plot}_name`] : item.name;

            // Jika nama asal kosong, papar input box. Jika tak, papar teks biasa.
            let nameCellContent = '';
            if (item.name === "") {
                nameCellContent = `<input type="text" class="name-input" data-plot="${item.plot}" value="${customName}" placeholder="Masukkan Nama Pemilik...">`;
            } else {
                nameCellContent = customName;
            }

            // Apply kelas hijau jika sudah ditanda (tick)
            const kaveatClass = isKaveatTicked ? 'bg-green' : '';
            const spaClass = isSpaTicked ? 'bg-green' : '';
            const lawyerClass = isLawyerTicked ? 'bg-green' : '';

            tr.innerHTML = `
                <td style="text-align: center; font-weight: bold;">${item.plot}</td>
                <td>${nameCellContent}</td>
                <td class="center-check ${kaveatClass}"><input type="checkbox" data-plot="${item.plot}" data-type="kaveat" ${isKaveatTicked ? 'checked' : ''}></td>
                <td class="center-check ${spaClass}"><input type="checkbox" data-plot="${item.plot}" data-type="spa" ${isSpaTicked ? 'checked' : ''}></td>
                <td class="center-check ${lawyerClass}"><input type="checkbox" data-plot="${item.plot}" data-type="lawyer" ${isLawyerTicked ? 'checked' : ''}></td>
            `;
            tbody.appendChild(tr);
        });

        // Event listener untuk simpan tick dan tukar warna
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const plot = this.getAttribute('data-plot');
                const type = this.getAttribute('data-type');
                const isChecked = this.checked;

                // Update warna background (tambah buang kelas hijau)
                if (isChecked) {
                    this.parentElement.classList.add('bg-green');
                } else {
                    this.parentElement.classList.remove('bg-green');
                }

                // Update & save ke storage
                savedData[`${plot}_${type}`] = isChecked;
                localStorage.setItem("lot77Data", JSON.stringify(savedData));
            });
        });

        // Event listener untuk simpan nama custom yang ditaip
        document.querySelectorAll('.name-input').forEach(input => {
            input.addEventListener('input', function() {
                const plot = this.getAttribute('data-plot');
                savedData[`${plot}_name`] = this.value;
                localStorage.setItem("lot77Data", JSON.stringify(savedData));
            });
        });
    }

    // Fungsi clear data jika nak kosongkan semua
    function clearData() {
        if(confirm("Adakah anda pasti untuk memadam semua rekod tapak, nama tambahan, dan bayaran?")) {
            localStorage.removeItem("lot77Data");
            for (let key in savedData) delete savedData[key];
            renderTable(); // render semula jadual asal
        }
    }

    // Paparkan jadual kali pertama
    renderTable();
</script>

</body>
</html>
